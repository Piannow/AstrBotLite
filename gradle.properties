## Gradle 构建参数（单线程，apt 内存已调大）
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1

## Disable stable IDs to avoid AAPT file locking issue on Windows (error 13)
## AGP 8.2 的实际选项名是 android.injected.enableStableIds（android.enableStableIds 不被识别）
android.injected.enableStableIds=false
# Disable resource cruncher to avoid file locking
android.enableResourceOptimizations=false

## AAPT2 覆盖：Gradle 缓存里的 aapt2.exe 在本机无法创建任何输出文件
## （报 "数据无效 (13)"，同二进制复制到别处即可正常工作）→ 指向可用的副本
android.aapt2FromMavenOverride=D:\\aapt2fix\\aapt2.exe

## webviewup（io.github.jonanorman.android.webviewup）传递引入 AndroidX，
## AGP 要求显式声明，否则 mergeReleaseNativeLibs 直接失败
android.useAndroidX=true
